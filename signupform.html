<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Clearance | Blacklist Division</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loginContainer">

    <div class="loginCard">

        <h1>REQUEST CLEARANCE</h1>
        <p>Create an account</p>

        <input 
    id="fullName"
    type="text" 
    placeholder="Full Name">

<input 
    id="nickname"
    type="text" 
    placeholder="A nickname of your choosing">

<input 
    id="password"
    type="password" 
    placeholder="Password">

<input 
    id="referral"
    type="text" 
    placeholder="Nickname of the member who referred you">

<input 
    id="reason"
    type="text" 
    placeholder="Additional info (like why you want to join)">

        <button id="signupButton">
            REQUEST ACCESS
        </button>

        <span>
            Already have clearance?
            <a href="login.html">Authenticate</a>
        </span>

    </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
